# ==============================================================================
# Google Cloud Build Pipeline for Thermal Power Plant SMS
# Builds, tests, containerizes, pushes to Artifact Registry, and deploys to Cloud Run
# ==============================================================================

steps:
  # ----------------------------------------------------------------------------
  # Step 1: Build & Tag Spring Boot Backend Container
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/sms-backend:${COMMIT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/sms-backend:latest'
      - './backend'
    waitFor: ['-']

  # ----------------------------------------------------------------------------
  # Step 2: Build & Tag Python FastAPI AI Microservice Container
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-ai-service'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/sms-ai-service:${COMMIT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/sms-ai-service:latest'
      - './ai-service'
    waitFor: ['-']

  # ----------------------------------------------------------------------------
  # Step 3: Build & Tag React + Nginx Frontend Container
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/sms-frontend:${COMMIT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/sms-frontend:latest'
      - './frontend'
    waitFor: ['-']

  # ----------------------------------------------------------------------------
  # Step 4: Push All Container Images to Google Artifact Registry
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend'
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/sms-backend']
    waitFor: ['build-backend']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-ai-service'
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/sms-ai-service']
    waitFor: ['build-ai-service']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-frontend'
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/sms-frontend']
    waitFor: ['build-frontend']

  # ----------------------------------------------------------------------------
  # Step 5: Deploy Python FastAPI AI Microservice to Cloud Run
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-ai-service'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'sms-ai-service'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/sms-ai-service:${COMMIT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--min-instances=0'
      - '--max-instances=5'
      - '--port=8000'
      - '--set-env-vars=DB_URL=postgresql+psycopg2://${_DB_USER}:${_DB_PASS}@${_DB_HOST}:5432/${_DB_NAME}'
    waitFor: ['push-ai-service']

  # ----------------------------------------------------------------------------
  # Step 6: Deploy Spring Boot Backend to Cloud Run with Cloud SQL Connection
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-backend'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'sms-backend-springboot'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/sms-backend:${COMMIT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=1'
      - '--max-instances=10'
      - '--port=8080'
      - '--add-cloudsql-instances=${_CLOUD_SQL_INSTANCE}'
      - '--set-env-vars=SPRING_PROFILES_ACTIVE=gcp,CLOUD_SQL_INSTANCE=${_CLOUD_SQL_INSTANCE},DB_NAME=${_DB_NAME},DB_USER=${_DB_USER},DB_PASS=${_DB_PASS},GCS_BUCKET_NAME=${_GCS_BUCKET},GCS_ENABLED=true'
    waitFor: ['push-backend', 'deploy-ai-service']

  # ----------------------------------------------------------------------------
  # Step 7: Deploy React + Nginx Frontend to Cloud Run
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-frontend'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'sms-frontend'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/sms-frontend:${COMMIT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=1'
      - '--max-instances=10'
      - '--port=8080'
    waitFor: ['push-frontend', 'deploy-backend']

# ------------------------------------------------------------------------------
# Default Build Substitutions
# ------------------------------------------------------------------------------
substitutions:
  _REGION: 'asia-south1'
  _REPOSITORY: 'sms-repo'
  _CLOUD_SQL_INSTANCE: 'thermal-power-plant-sms:asia-south1:sms-postgres'
  _GCS_BUCKET: 'sms-powerplant-assets'
  _DB_NAME: 'sms_db'
  _DB_USER: 'postgres'
  _DB_PASS: 'postgres'
  _DB_HOST: '10.0.0.3'

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/sms-backend:${COMMIT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/sms-backend:latest'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/sms-ai-service:${COMMIT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/sms-ai-service:latest'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/sms-frontend:${COMMIT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/sms-frontend:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
