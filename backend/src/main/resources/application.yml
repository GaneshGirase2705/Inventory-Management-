server:
  port: ${PORT:8080}

spring:
  application:
    name: sms-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sms_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

# Security & JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET:PowerPlantSmsThermalStoreSuperSecureSecretKey2026Exceeding256Bits!}
    expiration-ms: 86400000 # 24 Hours
  gcs:
    bucket-name: ${GCS_BUCKET_NAME:sms-powerplant-assets}
    enabled: ${GCS_ENABLED:false}
  ai-service:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}

---
# GCP Cloud Profile (Used when deployed on Cloud Run with Cloud SQL)
spring:
  config:
    activate:
      on-profile: gcp
  datasource:
    url: jdbc:postgresql:///${DB_NAME:sms_db}?cloudSqlInstance=${CLOUD_SQL_INSTANCE:thermal-power-plant-sms:asia-south1:sms-postgres}&socketFactory=com.google.cloud.sql.postgres.SocketFactory
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
  jpa:
    hibernate:
      ddl-auto: update
app:
  gcs:
    enabled: true

---
# Local In-Memory Dev Profile (For offline standalone testing without PostgreSQL)
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:sms_dev_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
